<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Joyeux Anniversaire 💙</title>

    <style>

        body {
        margin: 0;
        min-height: 100vh;

        background-color: #A9D9EF;

        font-family: "Comic Sans MS", cursive;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow-x: hidden;
        }

        .birthday-window {
        width: 700px;
        height: 390px;

        background-color: #BFE3F2;
        border: 3px solid #315E78;
        border-radius: 15px;
        padding: 35px;
        box-shadow: 8px 8px 0px #557cb3;

        box-sizing: border-box;
        position: relative;

    /*text-align: right;
     No big shadow — more like your drawing */
        }

        .top-section {

            position: right;

            width: 100%;
            height: 250px;

            display: block;

            margin: 0;
        }

        .top-section h1 {
            
            margin: 10px;
            color: #315E78;
            font-size: 60px;
            text-align: right;
            line-height: 1.05;
            font-weight: normal;
        }

        .name {
            margin: 8px;
            font-size: 47px;
            text-align: right;  
            color: #315E78;
        }

        .birthday-image {

        position: absolute;
        left: 80px;
        top: 133px;

        width: 200px;
        height: 190px;

        /* border: 3px solid #315E78;  

        border-radius: 10px;

        display: flex;

        justify-content: center;
        align-items: center;

        overflow: hidden; */

        background-color: #BFE3F2;

        }

        .birthday-image img {

            width: 100%;
            height: 100%;

            object-fit: contain;

        }

        .little-text {

            position: absolute;
            text-align: center;
            left: 65%;
            transform: translateX(-50%);
            top: 170px;
            width: 80%;
            font-size: 23px;
            color: #315E78;

        }

        .letter-button{
            position: absolute;

            right: 270px;
            bottom: 60px;

            width: 140px;
            height: 50px;

            padding: 0 10px;

            box-sizing: border-box;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 15px;

            font-family: inherit;
            font-size: 15px;

            text-align: center;
            white-space: nowrap;

            cursor: pointer;
            transition: 0.1s;
        }
        .letter-button:hover {
        background-color: #8FC8E3;
        transform: rotate(-8deg) scale(1.08);
        }

        .birthday-button {
            position: absolute;

            right: 80px;
            bottom: 60px;

            width: 150px;
            height: 50px;

            padding: 0 10px;

            box-sizing: border-box;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 15px;

            font-family: inherit;
            font-size: 15px;

            text-align: center;
            white-space: nowrap;

            cursor: pointer;
            transition: 0.1s;
        }
        
        .birthday-button:hover {
        background-color: #8FC8E3;
        transform: rotate(-8deg) scale(1.08);
        }
        .sec-birthday-button{
            position: absolute;

            right: -120px;
            bottom: 0;

            width: 90px;
            height: 50px;

            padding: 0 10px;

            box-sizing: border-box;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 15px;

            font-family: inherit;
            font-size: 15px;

            text-align: left;
            white-space: nowrap;

            cursor: pointer;
            transition: 0.1s;
        }

        .sec-birthday-button:hover {
        background-color: #8FC8E3;
        }

        .birthday-button:active {

        transform: scale(0.92);

        }

        #surprise {
            display: none;
            position: absolute;

            right: 20px;
            bottom: 10px;
        
            color: #315E78;

        }

        #second-button {
        display: none;
        transition: 1s;
        }

    .confetti {

    position: fixed;

    top: -20px;

    width: 10px;
    height: 16px;

    z-index: 9999;

    animation: fall 3s linear forwards;

    }

    @keyframes fall {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    100% {

        transform:
            translateY(110vh)
            rotate(720deg);

    }

    }

    .balloon {

    position: fixed;

    bottom: -100px;

    font-size: 50px;

    animation: floatUp 5s ease-out forwards;

    z-index: 5000;

    }

    @keyframes floatUp {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;

    }

    100% {

        transform:
            translateY(-120vh)
            rotate(20deg);

        opacity: 0;

    }

    }

    .shake {

    animation: shake 0.5s;

    }

    @keyframes shake {

    0% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-8px) rotate(-1deg);
    }

    40% {
        transform: translateX(8px) rotate(1deg);
    }

    60% {
        transform: translateX(-8px) rotate(-1deg);
    }

    80% {
        transform: translateX(8px) rotate(1deg);
    }

    100% {
        transform: translateX(0);
    }

    }


/* =========================
   PHONE
========================= */

    @media (max-width: 600px) {

    body {

        padding: 20px;

        box-sizing: border-box;

    }


    .birthday-window {

        width: 95%;

        height: 430px;

        padding: 25px;

    }


    .top-section h1 {

        font-size: 36px;

    }


    .name {

        font-size: 22px;

    }


    .birthday-image {

        left: 15px;

        width: 85px;
        height: 85px;

    }


    .little-text {

        font-size: 15px;

    }

    }

    </style>

</head>


<body>

    <div class="birthday-window" id="birthday-window">


        <div class="top-section">


            <div>

                <h1>
                    Joyeux Anniversaire
                </h1>

                <div class="name">
                    .𖥔 ݁ ˖🛸.✦ Mael ⋆✦⋆
                </div>

            </div>

            <div class="birthday-image">
                <img src="happy-birthday.gif"  alt="Birthday picture">
            </div>


        </div>


        <p class="little-text">
            𓆝 𓆟 𓆞 𓆝 𓆟 𓆝 𓆟 𓆞 𓆟 <br>
            Je t'ai écrit une petite lettre...

        </p>


        <!-- FIRST BUTTON -->
        <button class="letter-button" onclick="window.location.href='letter.html'">
            Petit cadeau
        </button>

        <button class="birthday-button" onclick="firstSurprise();
        new Audio('putangina.mp3').play()">
            SPAM ce boutton!
        </button>

        <div id="surprise">
            YOUHOUU
        </div>


        <!-- SECOND BUTTON -->

        <button
            id="second-button"
            class="sec-birthday-button"
            onclick="secondSurprise()"
        >

            Click pas <br>
            ici

        </button>

    </div>

    <!-- JAVA -->
    <script>

        function makeConfetti() {

            const colors = [

                "#1E6FA8",
                "#4FA3D1",
                "#A8D8F0",
                "#164766",
                "#FFFFFF",
                "#F5C542"

            ];


            for (let i = 0; i < 100; i++) {


                const confetti =
                    document.createElement("div");


                confetti.classList.add("confetti");


                /* Random horizontal position */

                confetti.style.left =
                    Math.random() * 100 + "vw";


                /* Random color */

                confetti.style.backgroundColor =
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ];


                /* Random rotation */

                confetti.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                /* Random animation speed */

                confetti.style.animationDuration =
                    2 +
                    Math.random() * 2 +
                    "s";


                document.body.appendChild(confetti);


                /* Remove after animation */

                setTimeout(function() {

                    confetti.remove();

                }, 4000);

            }

        }

        function firstSurprise() {

            makeConfetti();

            makeBalloons();
            const window =
                document.getElementById(
                    "birthday-window"
                );

            window.classList.add("shake");

            setTimeout(function() {

                window.classList.remove("shake");

            }, 500);

            setTimeout(function() {
                document.getElementById("surprise").style.display = "block";
                document.getElementById("second-button").style.display = "inline-block";
            }, 4000);

        }

        function makeBalloons() {


            const balloons = [

                "🎈",
                "🎈",
                "🎈",
                "🎈",
                "🎈"

            ];


            balloons.forEach(function(balloon) {


                const element =
                    document.createElement("div");


                element.classList.add("balloon");


                element.innerHTML = balloon;


                /* Random position */

                element.style.left =
                    Math.random() * 100 + "vw";


                /* Random size */

                element.style.fontSize =
                    35 +
                    Math.random() * 35 +
                    "px";


                /* Random speed */

                element.style.animationDuration =
                    4 +
                    Math.random() * 3 +
                    "s";


                document.body.appendChild(element);


                setTimeout(function() {

                    element.remove();

                }, 7000);

            });

        }

        function secondSurprise() {

            makeConfetti();

            const window =
                document.getElementById(
                    "birthday-window"
                );

            window.classList.add("shake");

            setTimeout(function() {

                window.classList.remove("shake");

            }, 500);


            alert(
                "Ay! Gago!"
            );

        }

        function playSound() {
            const sound = new Audio("putangina.mp3");
            sound.play();
        }
    </script>


</body>

</html>
