<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Letter</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #A9D9EF;

            font-family: "Comic Sans MS", cursive;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-container {
            position: relative;

            width: 500px;

            display: flex;
            justify-content: center;

            overflow: visible;
        }

        .letter {
            width: 500px;
            height: auto;

            display: block;

            position: relative;
            z-index: 2;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 18px;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 12px;

            font-family: "Comic Sans MS", cursive;
            font-size: 16px;

            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }

        .back-button:hover {
            background-color: #8FC8E3;
            transform: scale(1.05);
        }

        .hidden-images {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: visible;

            pointer-events: none;

            z-index: 3;
        }

        .hidden-images img {
            position: absolute;

            width: 200px;
            height: 210px;

            object-fit: cover;

            border: 2px solid #315E78;
            border-radius: 5px;

            opacity: 0;

            pointer-events: none;
        }

        #image1 {
            left: calc(50% - 430px);
            top: 18%;
        }

        #image1.show {
            animation: photo1Appear 0.6s ease forwards;
        }

        @keyframes photo1Appear {

            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.1) rotate(-13deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(-10deg);
            }

        }

        #image2 {
            left: calc(50% + 200px);
            top: 30%;
        }

        #image2.show {
            animation: photo2Appear 0.6s ease forwards;
        }

        @keyframes photo2Appear {

            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.1) rotate(11deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(10deg);
            }

        }

        #image3 {
            left: calc(50% - 430px);
            top: 60%;
        }

        #image3.show {
            animation: photo3Appear 0.6s ease forwards;
        }

        @keyframes photo3Appear {

            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.1) rotate(7deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(8deg);
            }

        }

        #image4 {
            left: calc(50% + 200px);
            top: 65%;
        }

        #image4.show {
            animation: photo4Appear 0.6s ease forwards;
        }

        @keyframes photo4Appear {

            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.1) rotate(-10deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(-7deg);
            }

        }

        .photo-button {
            position: fixed;
            top: 20px;
            right: 10px;
            padding: 10px 18px;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 15px;

            font-family: "Comic Sans MS", cursive;
            font-size: 17px;

            cursor: pointer;

            transition: 0.2s;
            z-index: 10;
        }

        .photo-button:hover {
            background-color: #8FC8E3;

            transform: rotate(-3deg) scale(1.05);
        }

        .reset-button {
            display: none;
            position: fixed;

            top: 74px;
            right: 10px;

            padding: 1px 5px;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 12px;

            font-family: "Comic Sans MS", cursive;
            font-size: 25px;
            cursor: pointer;

            transition: 0.2s;

            z-index: 10;
        }
        .reset-button:hover {
            background-color: #8FC8E3;
            transform: rotate(3deg) scale(1.05);
        }

        .ctrl-z-button {
            display: none;
            position: fixed;

            top: 74px;
            right: 45px;

            padding: 7px 3px;

            background-color: #BFE3F2;
            color: #315E78;

            border: 3px solid #315E78;
            border-radius: 12px;

            font-family: "Comic Sans MS", cursive;
            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;

            z-index: 10;
        }
        .ctrl-z-button:hover {
            background-color: #8FC8E3;
            transform: rotate(3deg) scale(1.05);
        }

        @media (max-width: 800px) {

            .letter-container {
                width: 350px;
            }

            .letter {
                width: 350px;
            }

            .hidden-images img {
                width: 130px;
                height: 140px;
            }

            #image1 {
                left: -100px;
            }

            #image2 {
                left: 320px;
            }

            #image3 {
                left: -100px;
            }

            #image4 {
                left: 320px;
            }

        }

    </style>

</head>


<body>

    <button
        class="back-button"
        onclick="goBack()">

        Retour

    </button>

    <div class="letter-container">

        <img
            class="letter"
            src="letter.png"
            alt="Birthday letter">

        <div class="hidden-images">

            <img
                id="image1"
                src="photo1.png"
                alt="Photo 1">

            <img
                id="image2"
                src="photo2.png"
                alt="Photo 2">

            <img
                id="image3"
                src="photo3.png"
                alt="Photo 3">

            <img
                id="image4"
                src="photo4.png"
                alt="Photo 4">

        </div>

    </div>


    <button
        class="photo-button"
        onclick="showNextImage()">

        Photos

    </button>

    <button
        class="ctrl-z-button"
        onclick="removeLastImage()">

        Ctrl+Z

    </button>

    <button
        class="reset-button"
        onclick="resetPhotos(); new Audio('magic-fairy.mp3').play()">
        ⟲

    </button>


<script>

    let currentImage = 0;

    function showNextImage() {

        currentImage++;

        const image =
            document.getElementById("image" + currentImage);

        if (image) {

            image.classList.add("show");

            new Audio("magic-fairy.mp3").play();

            // Make Ctrl+Z and Reset appear
            document.querySelector(".ctrl-z-button").style.display = "block";
            document.querySelector(".reset-button").style.display = "block";

        }

    }


    function resetPhotos() {

        const images =
            document.querySelectorAll(".hidden-images img");

        images.forEach(function(image) {

            image.classList.remove("show");

        });

        currentImage = 0;

        // Hide Ctrl+Z and Reset again
        //document.querySelector(".ctrl-z-button").style.display = "none";
        //document.querySelector(".reset-button").style.display = "none";

    }


    function removeLastImage() {

        if (currentImage > 0) {

            const image =
                document.getElementById("image" + currentImage);

            image.classList.remove("show");
            new Audio("magic-fairy.mp3").play();
            currentImage--;

        }

    }


    function goBack() {

        new Audio("magic-fairy.mp3").play();

        setTimeout(function() {

            window.location.href = "index.html";

        }, 150);

    }

</script>

</body>

</html>
